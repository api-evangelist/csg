name: create-payment-method
description: >-
  Tokenize and store a customer's credit card or echeck payment method under a
  CSG Forte organization and location for later use in transactions.
api: csg-forte-rest-api
operationId: createPaymentMethod
method: POST
path: /organizations/{organizationId}/locations/{locationId}/paymentmethods
inputs:
  - name: organizationId
    in: path
    required: true
  - name: locationId
    in: path
    required: true
  - name: payment_method
    in: body
    required: true
    description: Payment method details (card number, expiration, account, routing).
outputs:
  - name: payment_method
    description: Stored payment method with token for later use.
sideEffects: create
authentication: basic
