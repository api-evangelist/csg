    description: CSG Forte REST API — Customers business capability. Self-contained, no shared references.
    resources:
    - name: organizations-organizationId-locations-locationId-customers
      path: /organizations/{organizationId}/locations/{locationId}/customers
      operations:
      - name: listcustomers
        method: GET
        description: List customers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organizationId
          in: path
          type: string
          required: true
        - name: locationId
          in: path
          type: string
          required: true
        - name: first_name
          in: query
          type: string
        - name: last_name
          in: query
          type: string
        - name: customer_token
          in: query
          type: string
        - name: page_index
          in: query
          type: integer
        - name: page_size
          in: query
          type: integer
      - name: createcustomer
        method: POST
        description: Create a customer record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organizationId
          in: path
          type: string
          required: true
        - name: locationId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: organizations-organizationId-locations-locationId-customers-customerId
      path: /organizations/{organizationId}/locations/{locationId}/customers/{customerId}
      operations:
      - name: getcustomer
        method: GET
        description: Get customer details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organizationId
          in: path
          type: string
          required: true
        - name: locationId
          in: path
          type: string
          required: true
        - name: customerId
          in: path
          type: string
          required: true
      - name: updatecustomer
        method: PUT
        description: Update a customer record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: organizationId
          in: path
          type: string
          required: true
        - name: locationId
          in: path
          type: string
          required: true
        - name: customerId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletecustomer
