name: create-transaction
description: >-
  Create a new credit card, echeck, or scheduled payment transaction within a
  CSG Forte organization and location. The request payload includes amount,
  customer/payment method references, and authorization details.
api: csg-forte-rest-api
operationId: createTransaction
method: POST
path: /organizations/{organizationId}/locations/{locationId}/transactions
inputs:
  - name: organizationId
    in: path
    required: true
  - name: locationId
    in: path
    required: true
  - name: transaction
    in: body
    required: true
    description: Transaction payload with action, amount, payment method and customer info.
outputs:
  - name: transaction
    description: Created transaction record with assigned identifier and status.
sideEffects: create
authentication: basic
