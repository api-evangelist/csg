specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: CSG Systems
providerId: csg
publisherName: CSG Systems
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Billing
  - Customer Engagement
  - Payments
  - Revenue Management
  - Telecom
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the CSG Systems API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: CSG Systems
  ServiceCategory: Developer Tools / API
  ProviderName: CSG Systems
  PublisherName: CSG Systems
  InvoiceIssuerName: CSG Systems
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: CSG Forte REST API
    baseURL: https://api.forte.net/v3
    tags:
      - ACH
      - Billing
      - Credit Card
      - Payments
      - PCI
      - REST
    serviceName: CSG Forte REST API
    serviceCategory: API
  - name: CSG Forte.js
    baseURL: https://api.forte.net
    tags:
      - JavaScript
      - Payments
      - SDK
      - Web
    serviceName: CSG Forte.js
    serviceCategory: API
  - name: CSG Forte React Native SDK
    baseURL: https://api.forte.net
    tags:
      - Mobile
      - Payments
      - React Native
      - SDK
    serviceName: CSG Forte React Native SDK
    serviceCategory: API
  - name: CSG Singleview Billing API
    baseURL: https://api.csgi.com
    tags:
      - Billing
      - BSS
      - Revenue Management
      - SOAP
      - Telecom
    serviceName: CSG Singleview Billing API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
