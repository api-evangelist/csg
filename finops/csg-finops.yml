description: 'FOCUS-aligned FinOps for CSG Systems: enterprise BSS/OSS subscriptions plus Forte per-transaction
  payments processing; pricing is custom-negotiated and not publicly disclosed.'
sources:
  - https://www.csgi.com/products/
notes: No public pricing. Treat meters as descriptive; reconcile per-transaction rates and seat fees
  from the active CSG contract.
principles:
  - name: Visibility
    description: Use the CSG partner / merchant portal for transaction-level reporting; reconcile against
      the monthly statement and Forte settlement files.
  - name: Allocation
    description: Tag Forte transactions with merchant_id / division and Singleview line items with cost
      center to attribute spend.
  - name: Optimization
    description: Negotiate volume tiers at renewal; route ACH-eligible payments away from card rails;
      consolidate billing tenants where possible.
  - name: Accountability
    description: Finance and Telecom-ops jointly own the CSG contract; review monthly invoices for take-rate
      drift and seat utilization.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Forecasting
      - Budgeting
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
billingModel:
  pricingCategory: Enterprise Contract + Take Rate
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: CSG Systems
  ServiceCategory: Billing & Revenue Management
  ProviderName: CSG Systems
  PublisherName: CSG Systems International, Inc.
  InvoiceIssuerName: CSG Systems International, Inc.
  PricingCategory: Custom Contract
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: forte_card_transactions
    description: Card payment transactions processed via CSG Forte
    unit: transaction
    aggregation: sum
    dimensions:
      - merchant_id
      - card_brand
      - currency
  - name: forte_ach_transactions
    description: ACH transactions processed via CSG Forte
    unit: transaction
    aggregation: sum
    dimensions:
      - merchant_id
  - name: singleview_subscribers
    description: Billed subscribers / accounts on Singleview / ACP
    unit: subscriber-month
    aggregation: max
    dimensions:
      - tenant
      - product
  - name: api_requests
    description: API calls against CSG APIs (not separately billed; observed for capacity)
    unit: request
    aggregation: sum
    dimensions:
      - api
      - tenant
apis:
  - name: CSG Forte REST API
    baseURL: https://api.forte.net/v3
    tags:
      - ACH
      - Billing
      - Credit Card
      - Payments
      - PCI
      - REST
    serviceName: CSG Forte REST API
    serviceCategory: API
  - name: CSG Forte.js
    baseURL: https://api.forte.net
    tags:
      - JavaScript
      - Payments
      - SDK
      - Web
    serviceName: CSG Forte.js
    serviceCategory: API
  - name: CSG Forte React Native SDK
    baseURL: https://api.forte.net
    tags:
      - Mobile
      - Payments
      - React Native
      - SDK
    serviceName: CSG Forte React Native SDK
    serviceCategory: API
  - name: CSG Singleview Billing API
    baseURL: https://api.csgi.com
    tags:
      - Billing
      - BSS
      - Revenue Management
      - SOAP
      - Telecom
    serviceName: CSG Singleview Billing API
    serviceCategory: API
unitEconomics:
  - name: Cost per Transaction
    metric: billed_cost / (forte_card_transactions + forte_ach_transactions)
    target: TBD
  - name: Cost per Subscriber
    metric: billed_cost / singleview_subscribers
    target: TBD
