specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: CSG Systems
providerId: csg
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Billing
  - Customer Engagement
  - Payments
  - Revenue Management
  - Telecom
  - Rate Limiting
description: CSG does not publish numeric API rate limits publicly. Forte and Singleview integrations
  enforce per-merchant / per-tenant throttling; specific limits are documented in the partner portal
  after onboarding.
sources:
  - https://www.csgi.com/products/
notes: Public docs are gated. Rate limits are documented in the merchant / partner portal; reconcile
  with published values after API onboarding.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Forte payments per-merchant throttle
    scope: merchant
    metric: varies
    limit: see partner portal documentation
    applies:
      - CSG Forte REST API
      - CSG Forte.js
      - CSG Forte React Native SDK
  - name: Singleview Billing per-tenant throttle
    scope: tenant
    metric: varies
    limit: see CSG integration documentation
    applies:
      - CSG Singleview Billing API
policies:
  - name: Backoff Strategy
    description: Honor Retry-After when present; use exponential backoff with jitter on 429 / 503 responses.
  - name: Onboarding-time disclosure
    description: Concrete RPS / TPS budgets are shared during merchant or BSS onboarding, not on the public
      product pages.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
